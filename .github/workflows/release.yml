name: Release
on:
  workflow_dispatch:
    inputs:
      target:
        description: Package index
        type: choice
        options: [testpypi, pypi]
        default: testpypi
        required: true
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}-${{ inputs.target || 'pypi' }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Verify archive contents and release tag
        env:
          TARGET: ${{ inputs.target || 'pypi' }}
        run: |
          if [ "$TARGET" = "pypi" ]; then
            test "$GITHUB_REF_TYPE" = "tag"
            python scripts/check_dist.py --tag "$GITHUB_REF_NAME"
          else
            python scripts/check_dist.py
          fi
      - run: python -m pip install dist/*.whl
      - name: Test installed wheel outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
          itopcli --help
          itopcli query --class Server --dry-run
          python -m pip check
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/itopcli
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
  publish-pypi:
    if: github.event_name == 'release' || inputs.target == 'pypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/itopcli
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
