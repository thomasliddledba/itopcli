[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "itopcli"
version = "0.1.0.dev1"
description = "Command-line client for Combodo iTop ITSM and CMDB"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Thomas Liddle"}]
keywords = ["itop", "cmdb", "itsm", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: System :: Systems Administration",
]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/thomasliddledba/itopcli"
Repository = "https://github.com/thomasliddledba/itopcli"
Issues = "https://github.com/thomasliddledba/itopcli/issues"
Changelog = "https://github.com/thomasliddledba/itopcli/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "build",
    "twine",
    "pylint==3.3.5",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
itopcli = "itopcli_app.cli:cli"

[tool.setuptools.packages.find]
include = ["itopcli_app*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
